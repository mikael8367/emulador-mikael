name: Build Winlator base (integration test)

on:
  push:
    branches:
      - integracao-winlator
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-winlator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project and linked source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Build Winlator source APK
        working-directory: winlator-source
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload base APK for inspection
        uses: actions/upload-artifact@v4
        with:
          name: winlator-base-debug-apk
          path: winlator-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
