name: Build single combined APK

on:
  push:
    branches:
      - integracao-winlator
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-combined:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Emulador Mikael UI
        uses: actions/checkout@v4

      - name: Checkout Winlator engine and native components
        uses: actions/checkout@v4
        with:
          repository: brunodev85/winlator
          ref: main
          path: upstream-winlator
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;24.0.8215888 cmake;3.22.1'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Combine Mikael UI and Winlator in one app
        shell: bash
        run: |
          set -euo pipefail
          APP="upstream-winlator/app"
          mkdir -p "$APP/app/src/main/java/br/com/mikael/emulador"
          cp app/src/main/java/br/com/mikael/emulador/MainActivity.java "$APP/app/src/main/java/br/com/mikael/emulador/MainActivity.java"

          sed -i "s|applicationId 'com.winlator'|applicationId 'br.com.mikael.emulador'|" "$APP/app/build.gradle"
          sed -i 's|<string name="app_name">Winlator</string>|<string name="app_name">Emulador Mikael</string>|' "$APP/app/src/main/res/values/strings.xml"

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = "upstream-winlator/app/app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          android = "{http://schemas.android.com/apk/res/android}"
          tree = ET.parse(path)
          root = tree.getroot()
          app = root.find("application")
          if app is None:
              raise SystemExit("Manifesto sem elemento application")
          # Keep Winlator's native activity available, but make Mikael's custom UI the launcher.
          for activity in app.findall("activity"):
              if activity.get(android + "name") == "com.winlator.MainActivity":
                  for intent in list(activity.findall("intent-filter")):
                      if any((node.get(android + "name") == "android.intent.action.MAIN") for node in intent.findall("action")):
                          activity.remove(intent)
          if not any(a.get(android + "name") == "br.com.mikael.emulador.MainActivity" for a in app.findall("activity")):
              activity = ET.SubElement(app, "activity", {
                  android + "name": "br.com.mikael.emulador.MainActivity",
                  android + "exported": "true",
                  android + "theme": "@style/AppThemeDark",
                  android + "screenOrientation": "sensor",
                  android + "configChanges": "keyboard|keyboardHidden|orientation|screenSize|screenLayout|smallestScreenSize|density|navigation"
              })
              intent = ET.SubElement(activity, "intent-filter")
              ET.SubElement(intent, "action", {android + "name": "android.intent.action.MAIN"})
              ET.SubElement(intent, "category", {android + "name": "android.intent.category.LAUNCHER"})
          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY
          grep -q "br.com.mikael.emulador.MainActivity" "$APP/app/src/main/AndroidManifest.xml"
          grep -q "br.com.mikael.emulador" "$APP/app/build.gradle"

      - name: Build one combined APK
        working-directory: upstream-winlator/app
        run: ./gradlew --no-daemon assembleDebug

      - name: Prepare single APK artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp upstream-winlator/LICENSE dist/WINLATOR-LICENSE
          cp upstream-winlator/app/app/build/outputs/apk/debug/app-debug.apk dist/Emulador-Mikael-completo.apk
          cat > dist/BUILD-INFO.txt <<'EOF'
          Emulador Mikael - APK combinado
          Inclui a interface personalizada Mikael e o motor baseado no projeto Winlator.
          Upstream: https://github.com/brunodev85/winlator
          Licença do Winlator: LGPL-2.1; consulte WINLATOR-LICENSE.
          Primeiro uso: internet e armazenamento livre podem ser necessários para baixar/preparar componentes.
          Compatibilidade não é garantida para todo EXE/jogo ou GPU. Teste no dispositivo-alvo.
          EOF

      - name: Upload single combined APK
        uses: actions/upload-artifact@v4
        with:
          name: emulador-mikael-completo-apk
          path: |
            dist/Emulador-Mikael-completo.apk
            dist/WINLATOR-LICENSE
            dist/BUILD-INFO.txt
          if-no-files-found: error
